[package]
name = "lailaisay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI proof path for the lailaisay Rust rewrite"

[[bin]]
name = "lailaisay-cli"
path = "src/main.rs"

[features]
default = []
whisper = ["lailaisay-stt/whisper"]
metal = ["lailaisay-stt/metal"]
mic = ["lailaisay-stt/mic"]

[dependencies]
lailaisay-core.workspace = true
lailaisay-stt.workspace = true
lailaisay-enhance.workspace = true
lailaisay-input.workspace = true
lailaisay-paste.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
