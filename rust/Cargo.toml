[workspace]
resolver = "2"
members = [
    "crates/lailaisay-core",
    "crates/lailaisay-stt",
    "crates/lailaisay-enhance",
    "crates/lailaisay-input",
    "crates/lailaisay-paste",
    "crates/lailaisay-cli",
    "crates/lailaisay-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["lailaisay contributors"]
repository = "https://github.com/laihenyi/lailaisay"
rust-version = "1.85"

[workspace.dependencies]
lailaisay-core = { path = "crates/lailaisay-core" }
lailaisay-stt = { path = "crates/lailaisay-stt" }
lailaisay-enhance = { path = "crates/lailaisay-enhance" }
lailaisay-input = { path = "crates/lailaisay-input" }
lailaisay-paste = { path = "crates/lailaisay-paste" }

anyhow = "1"
arboard = "3"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.15"
dirs = "5"
hound = "3"
pinyin = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zhconv = "0.3"

# winit 0.30.13 with the private CGSSetWindowBackgroundBlurRadius /
# CGSMainConnectionID calls removed; Mac App Store review rejects binaries
# that reference them. See vendor/winit/src/platform_impl/macos/ffi.rs.
[patch.crates-io]
winit = { path = "vendor/winit" }
